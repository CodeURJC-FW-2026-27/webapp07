<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de equipo | LaLiga</title>
  <link href="/public/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/global.css" rel="stylesheet">
  <link href="/public/css/formulario.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="/public/css/font-awesome.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Mukta&display=swap" rel="stylesheet">
  <script src="/public/js/jquery-2.1.1.min.js"></script>
  <script src="/public/js/bootstrap.min.js"></script>
</head>

<body>

 {{> header}}

  <section id="center" class="clearfix center_blog">
    <div class="container">
      <div class="row">
        <div class="center_blog1 clearfix">
          <div class="col-sm-12">
            <h2 class="mgt">Formulario de equipo</h2>
            <p>Prepara la ficha de un equipo de LaLiga.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="formulario-equipo">
    <div class="container">
      <div class="row">
        <div class="col-md-8">
          <p>Completa los datos del equipo. Los campos con * son obligatorios.</p>

          <form action="/guardarEquipo" method="POST" enctype="multipart/form-data" id="nuevo-equipo">
            <div class="form-group">
              <label for="nombre">Nombre del club *</label>
              <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
              <label for="ciudad">Ciudad *</label>
              <input type="text" class="form-control" id="ciudad" name="ciudad" required>
            </div>
            <div class="form-group">
              <label for="fecha">Fecha de fundación *</label>
              <input type="date" class="form-control" id="fecha" name="fecha" required>
            </div>
            <div class="form-group">
              <label for="imagen">Foto del escudo del club *</label>
              <input type="file" id="imagen" name="imagen" required>
            </div>
            <div class="form-group">
              <label for="estadio">Estadio *</label>
              <input type="text" class="form-control" id="estadio" name="estadio" required>
            </div>
            <div class="form-group">
              <label for="biografia">Biografía del club</label>
              <textarea class="form-control" id="biografia" name="biografia" rows="7"
                placeholder="Cuenta la historia del club, sus orígenes y sus momentos más importantes."></textarea>
            </div>
            <div class="form-group">
              <label for="temporadas">Temporadas jugadas en primera division</label>
              <input type="number" class="form-control" id="temporadas" name="temporadas">
            </div>
            <div class="form-group">
              <label for="ligas">Ligas ganadas</label>
              <input type="number" class="form-control" id="ligas" name="ligas">
            </div>
            <div class="form-group">
              <label for="mejor-posicion">Mejor posicion histórica</label>
              <select class="form-control" id="mejor-posicion" name="mejorPosicion">
                <option value="">Selecciona una posición</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
              </select>
            </div>
            <div class="form-group">
              <label for="dato">Dato curioso</label>
              <textarea class="form-control" id="dato" name="dato" rows="3"
                placeholder="Ej.: Tiene 15 Champions League."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="crear-equipo">Guardar</button>
            <button type="reset" class="btn btn-default">Limpiar</button>
            <a href="/index/1" class="btn btn-default">Cancelar</a>
          </form>
        </div>
      </div>
    </div>
  </section>

{{> footer}}

</body>

</html>
